# One model alone (Qwen model on Groq), used to compare models on the same tasks:
#   python -m farm bench --models models.only-qwen.yaml --tag qwen
roles:
  coder:
    chain:
      - groq/qwen/qwen3.8-27b

# Tokens per minute the provider allows, per model. The farm waits for room instead of
# sending a call that would be rejected (429). All workers share this budget.
rate_limits:
  groq/qwen/qwen3.8-27b: 8000

settings:
  max_attempts: 3        # attempts per task before it is marked failed
  test_timeout_s: 60     # the gatekeeper kills a test run after this long
  call_timeout_s: 120    # one model call
  sandbox: docker