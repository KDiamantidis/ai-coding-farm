# One model alone (Gemini), used to compare models on the same tasks:
#   python -m farm bench --models models.only-gemini.yaml --tag gemini
roles:
  coder:
    chain:
      - gemini/gemini-3.8-flash

settings:
  max_attempts: 3        # attempts per task before it is marked failed
  test_timeout_s: 60     # the gatekeeper kills a test run after this long
  call_timeout_s: 120    # one model call
