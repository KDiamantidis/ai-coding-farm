# One model alone (small Groq model), used to compare models on the same tasks:
#   python -m farm bench --models models.only-gpt-oss-20b.yaml --tag 20b
roles:
  coder:
    chain:
      - groq/openai/gpt-oss-20b

# model_params:   # reasoning_effort low was tested: no empty answers, but worse code (54%)
#   groq/openai/gpt-oss-20b:
#     reasoning_effort: low

settings:
  max_attempts: 3        # attempts per task before it is marked failed
  test_timeout_s: 60     # the gatekeeper kills a test run after this long
  call_timeout_s: 120    # one model call
  sandbox: docker